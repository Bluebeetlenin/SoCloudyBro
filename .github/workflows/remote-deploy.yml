name: Remote Deploy to Firebase

on:
  push:
    branches:
      - claude/file-error-check-test-41ozdr
      - scb/main
    paths:
      - 'SoCloudyBro.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            SoCloudyBro.html
            vercel.json
          sparse-checkout-cone-mode: false

      # Every inline <script> must have its sha256 in vercel.json's CSP, or the
      # browser blocks it and the app freezes on the splash screen. Deploying a
      # page that fails this check would push a broken app to every user via
      # the site-update banner, so stop here instead.
      - name: Check inline-script hashes against the CSP
        run: |
          python3 - <<'PYEOF'
          import base64, hashlib, re, sys

          html = open("SoCloudyBro.html", encoding="utf-8").read().replace("\r", "")
          csp = open("vercel.json", encoding="utf-8").read()

          missing = []
          pattern = re.compile(r"<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>", re.I | re.S)
          for m in pattern.finditer(html):
              if re.search(r"src\s*=", m.group("attrs")):
                  continue
              body = m.group("body")
              if not body.strip():
                  continue
              digest = base64.b64encode(hashlib.sha256(body.encode("utf-8")).digest()).decode()
              token = "sha256-" + digest
              if token not in csp:
                  line = html[:m.start()].count("\n") + 1
                  missing.append((token, line, len(body)))

          if missing:
              print("❌ Inline <script> hashes missing from vercel.json CSP:", file=sys.stderr)
              for token, line, size in missing:
                  print(f"   {token}  (script at line {line}, {size} chars)", file=sys.stderr)
              print("", file=sys.stderr)
              print("Fix: run  powershell -File scripts/update-csp-hashes.ps1  then commit vercel.json", file=sys.stderr)
              sys.exit(1)

          print("✅ All inline script hashes are in the CSP")
          PYEOF
        shell: bash

      - name: Push HTML to Firebase via Worker
        env:
          CLAUDE_DEPLOY_KEY: ${{ secrets.Claude_RemoteAccessKey }}
          WORKER_URL: https://socloudybro-firebase-rules.steveemil7.workers.dev
        run: |
          if [ -z "$CLAUDE_DEPLOY_KEY" ]; then
            echo "❌ CLAUDE_DEPLOY_KEY secret is not set in GitHub repo secrets."
            echo "   Go to repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          export VERSION=$(date +%s)
          export NOTE="Auto-deploy from commit ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}"

          python3 - <<'PYEOF'
          import gzip, json, os, subprocess, sys

          html_path = "SoCloudyBro.html"
          with open(html_path, "r", encoding="utf-8") as f:
              html = f.read()

          version = int(os.environ["VERSION"])
          note    = os.environ["NOTE"]
          key     = os.environ["CLAUDE_DEPLOY_KEY"]
          url     = os.environ["WORKER_URL"] + "/claude-deploy"

          payload = json.dumps({"html": html, "version": version, "note": note})
          compressed = gzip.compress(payload.encode("utf-8"), compresslevel=1)

          with open("/tmp/deploy_payload.gz", "wb") as f:
              f.write(compressed)

          print(f"Payload: {len(payload)//1024}KB → compressed: {len(compressed)//1024}KB")

          result = subprocess.run(
              ["curl", "-sf", "-X", "POST", url,
               "-H", "Content-Type: application/json",
               "-H", "Content-Encoding: gzip",
               "-H", f"X-Claude-Key: {key}",
               "--data-binary", "@/tmp/deploy_payload.gz",
               "--max-time", "120"],
              capture_output=True, text=True
          )
          print("stdout:", result.stdout)
          if result.returncode != 0:
              print("stderr:", result.stderr, file=sys.stderr)
              sys.exit(1)

          resp = json.loads(result.stdout)
          if not resp.get("ok"):
              print("Deploy failed:", resp, file=sys.stderr)
              sys.exit(1)

          print(f"✅ Deployed version {resp['version']} to Firebase")
          PYEOF
        shell: bash
